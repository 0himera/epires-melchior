[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melchior"
version = "0.1.0"
description = "Dual-Brain ML Auto-Research Agent powered by Jev (System 1) and LLM (System 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
filterwarnings = ["error::pytest.PytestWarning"]

[project.scripts]
melchior = "melchior.cli:main"

[tool.setuptools.packages.find]
include = ["melchior*"]
